; PHP-FPM Production Configuration — optimized for 4 vCPU / 4GB Cloud Run
; Replaces default www.conf dynamic pool with a static pool

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Static mode — all children are pre-forked and always available
; No overhead of spawning/killing processes per request
pm = static

; 4 vCPU × 8 workers = 32 children
; Each PHP-FPM worker uses ~40-80MB for Drupal
; 32 × 80MB = ~2.5GB — fits well in 4GB container
pm.max_children = 32

; Recycle workers after 1000 requests to prevent memory leaks
pm.max_requests = 1000

; Kill workers that take longer than 120s (stuck queries, etc.)
request_terminate_timeout = 120

; Slow log for debugging
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Status page for health monitoring
pm.status_path = /fpm-status

; Security: clear environment
clear_env = no
