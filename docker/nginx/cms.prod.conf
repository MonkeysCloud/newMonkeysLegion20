# CMS Nginx config — Drupal PHP-FPM on port 8080
# Optimized: FastCGI cache for API, gzip, security headers

# FastCGI cache zone: 2MB shared memory, 10m inactive TTL, max 100MB on disk
fastcgi_cache_path /tmp/nginx-cache levels=1:2 keys_zone=DRUPAL_API:2m
                   inactive=10m max_size=100m use_temp_path=off;

server {
    listen 8080;
    server_name _;

    root /var/www/html/web;
    index index.php index.html;

    client_max_body_size 128M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ───── Gzip compression ─────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/vnd.api+json
        image/svg+xml;

    # ───── FastCGI cache config ─────
    # Cache key: method + host + URI + query string
    set $skip_cache 0;

    # Skip cache for non-GET requests
    if ($request_method != GET) {
        set $skip_cache 1;
    }

    # Skip cache for authenticated requests
    if ($http_authorization) {
        set $skip_cache 1;
    }

    # Skip cache for admin and user-specific paths
    if ($request_uri ~* "^/(admin|user|api/me|api/auth|api/marketplace/my-)") {
        set $skip_cache 1;
    }

    # ───── PHP processing ─────
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;

        # Buffer tuning — larger buffers to avoid disk I/O
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # FastCGI caching
        fastcgi_cache DRUPAL_API;
        fastcgi_cache_valid 200 30s;
        fastcgi_cache_valid 404 5s;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;

        # Debug header — shows HIT/MISS/BYPASS
        add_header X-Cache $upstream_cache_status always;
    }

    # Drupal clean URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets — long cache, skip logging
    location ~* \.(css|js|gif|jpe?g|png|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block sensitive files
    location ~ /\.ht { deny all; }
    location ~ /\.git { deny all; }
    location ~ (^|/)\.(?!well-known) { deny all; }
    location ~* \.(txt|log|engine|inc|info|install|make|module|profile|test|po|sh|sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|/(\.(?!well-known).*|Entries.*|Repository|Root|Tag|composer\.(json|lock)|web\.config)$|/#hierarchical_select/ {
        deny all;
    }

    # Health check endpoint for Cloud Run
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # FPM status (internal only)
    location = /fpm-status {
        access_log off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        deny all;
    }
}
